  <script>
    (function () {
      const loader = document.getElementById('bootstrap-loader');
      const hideLoader = function () {
        if (!loader) return;
        loader.classList.add('is-hidden');
        window.removeEventListener('flutter-first-frame', hideLoader);
      };

      window.addEventListener('flutter-first-frame', hideLoader);
    })();
  </script>
